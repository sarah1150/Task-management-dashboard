<aside class="sidebar" [class.open]="this.modalService.navOpen()">
  <nav class="nav-list">
    @for (item of navigation; track item.label) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        (click)="this.modalService.closeNavigation()"
      >
        <div class="d-flex gap-2">
          <img [src]="item.icon" [alt]="item.icon" width="20" />
          <span>{{ item.label }}</span>
        </div>
      </a>
    }
  </nav>

  <button
    mat-flat-button
    color="primary"
    type="button"
    class="new-task-button"
    (click)="openCreateModal()"
  >
    <mat-icon>add</mat-icon> New task
  </button>
</aside>
