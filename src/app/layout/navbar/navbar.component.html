<header class="topbar">
  <div class="d-flex align-items-center">
    <img src="logo.svg" alt="Logo" class="logo me-2" />
    <h5 class="title mb-0">Task Manager</h5>
  </div>

  <button
    class="mobile-menu-button"
    mat-icon-button
    aria-label="Open navigation"
    (click)="this.modalService.navOpen.set(!this.modalService.navOpen())"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <label class="global-search">
    <mat-icon>search</mat-icon>
    <input
      type="search"
      placeholder="Search tasks..."
      [value]="currentQuery()"
      (input)="updateSearch($event)"
      aria-label="Search tasks"
    />
  </label>

  <div class="topbar-actions">
    <span class="icon-action" aria-hidden="true">
      <img src="bell.svg" alt="bell" />
    </span>
    <span class="topbar-divider"></span>
    <span class="top-user">
      <span class="bell">JD</span>
    </span>
  </div>
</header>
